<!DOCTYPE html>
<html lang="en" class="bg-slate-50 dark:bg-slate-950">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BudgetQuickly - Personal Finance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          extend: {
            colors: {
              primary: {
                50: 'var(--color-primary-50)',
                100: 'var(--color-primary-100)',
                500: 'var(--color-primary-500)',
                600: 'var(--color-primary-600)',
                700: 'var(--color-primary-700)',
                800: 'var(--color-primary-700)', // Map to 700 for fallback
                900: 'var(--color-primary-700)', // Map to 700 for fallback
              },
              accent: {
                50: 'var(--color-accent-50)',
                100: 'var(--color-accent-100)',
                500: 'var(--color-accent-500)',
                600: 'var(--color-accent-600)',
                700: 'var(--color-accent-700)',
                800: 'var(--color-accent-700)', // Map to 700 for fallback
                900: 'var(--color-accent-700)', // Map to 700 for fallback
              },
              secondary: '#ec4899',
              dark: '#020617', // Slate 950 for true dark
              'dark-card': '#0f172a' // Slate 900
            },
            boxShadow: {
              'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
              'glow': '0 0 15px rgba(99, 102, 241, 0.3)',
            }
          }
        }
      }
    </script>
    <style>
      /* Apply theme background to html to fix iOS overscroll flash */
      html {
        -webkit-tap-highlight-color: transparent;
      }
      body {
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        width: 100%;
        min-height: 100vh;
        overflow-x: hidden;
        position: relative;
      }
      
      /* Default Variables (Ocean Breeze) */
      :root {
        --color-primary-50: #eef2ff;
        --color-primary-100: #e0e7ff;
        --color-primary-500: #6366f1;
        --color-primary-600: #4f46e5;
        --color-primary-700: #4338ca;
        
        --color-accent-50: #ecfeff;
        --color-accent-100: #cffafe;
        --color-accent-500: #06b6d4;
        --color-accent-600: #0891b2;
        --color-accent-700: #0e7490;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #334155;
      }
      
      /* Glassmorphism utilities */
      .glass {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      .dark .glass {
        background: rgba(15, 23, 42, 0.7);
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
<script type="importmap">
{

    "react-router-dom": "https://esm.sh/react-router-dom@6.20.0?external=react,react-dom",
    "recharts": "https://esm.sh/recharts@2.10.0?external=react,react-dom",
    "date-fns": "https://esm.sh/date-fns@3.0.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.0",
    "vite": "https://esm.sh/vite@5.0.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@4.2.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
